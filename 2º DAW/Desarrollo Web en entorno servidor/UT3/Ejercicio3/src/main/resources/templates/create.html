<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Crea Nuevo Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
<form action="#" th:action="@{/animal/create}"
                 th:object="${animal}"
      method="post">
        <!--Revisar si falla los actions-->
        <label for="name" class="from-label">Nombre:</label>
        <input class="form-control" type="text" id="name" th:field="*{name}">
        <br>
        <label class="from-label">Vida media:</label>
        <input class="form-control" type="number" th:field="*{averageLifeSpan}">
        <br>
        <label class="from-label">Extinto:</label>
        <input class="from-check-input" type="checkbox" th:field="*{extinct}">
        <br>
       <input class="btn btn-outline-success" type="submit" value="Crear">
</form>

</body>
</html>
