<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Families</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
<header class="bg-dark text-white text-center p-4">
    <h1>Listado Families!!!! :D (^w^)</h1>
</header>

<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Nombre</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="family : ${families}" > <!--Lo paso aquí para no recorrerlo cada vez y así Detalles pilla el ID-->
        <td th:text="${family.getId()}"> </td>
        <td th:text="${family.getName()}"></td>
        <td><a class="btn theme-primary" th:href="@{/families/familyDetails/{id}(id=${family.getId()})}">Detalles</a></td>
        <td><a class="btn theme-primary">Editar</a></td>
        <td><a class="btn theme-primary">Borrar</a></td>
    </tr>
    </tbody>
</table>

</body>
</html>
