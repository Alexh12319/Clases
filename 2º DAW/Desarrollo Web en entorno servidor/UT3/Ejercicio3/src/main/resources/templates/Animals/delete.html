<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="https://www.thymeleaf.org">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>¿Seguro deseas borrar este elemento?</h1>
</header>

<ul>
    <li><span>Nombre: </span><span th:text="${animal.getName()}"></span></li>
    <li><span>Id: </span><span th:text="${animal.getId()}"></span></li>
    <li><span>Vida media: </span><span th:text="${animal.getAverageLifeSpan()}"></span></li>
    <li><span>Extinto: </span><span th:text="${animal.getExtinct()}"></span></li>
</ul>

<form th:action="@{/animals/delete}" method="post">
    <input type="hidden" name="id" th:value="${animal.id}">
    <button type="submit" class="btn btn-danger" th:href="@{/animals}">Borrar</button>
</form>

<a class="btn btn-outline-success" th:href="@{/animals}">
    Volver
</a>

</body>
</html>
